# Based on the workflow `brew tap-new` generates (Homebrew, Oct 2026).
# On every pull request it builds HBMAME on two macOS versions and keeps
# the finished bottles as downloadable artifacts for the publish step.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, now also Intel included. A bottle built on an older macOS also installs
        # on newer ones, so macos-15 covers Sequoia and later.
        os: [ macos-15, macos-26, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    # A full HBMAME build is long; GitHub's hard limit is 6 hours.
    timeout-minutes: 360
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Bottles are published as assets of a GitHub Release named after the
      # version (e.g. "hbmame-0.289.4") in this repository.
      - name: Build and test bottle
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
        run: |
          version="$(sed -nE 's/^  version "([^"]+)"/\1/p' Formula/hbmame.rb)"
          brew test-bot --only-formulae \
            --root-url="https://github.com/${REPO}/releases/download/hbmame-${version}"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
